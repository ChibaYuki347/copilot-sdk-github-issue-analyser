<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">GitHub Issue Complexity Analyser</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body>
    <div class="lang-switcher">
        <a href="?lang=en" data-lang="en">EN</a>
        <span>·</span>
        <a href="?lang=ja" data-lang="ja">日本語</a>
    </div>
    <h1 data-i18n="heading">🐛 GitHub Issue Complexity Analyser</h1>
    <p class="subtitle" data-i18n="subtitle">Analyse GitHub issues to determine the appropriate developer skill level</p>
    
    <div class="tabs">
        <div class="tab active" data-tab="url" data-i18n="tab.url">Paste URL</div>
        <div class="tab" data-tab="manual" data-i18n="tab.manual">Manual Entry</div>
    </div>
    
    <form id="analyseForm">
        <div id="url-tab" class="tab-content active">
            <div class="form-group">
                <label for="url" data-i18n="label.url">GitHub Issue URL</label>
                <input type="text" id="url" name="url" placeholder="https://github.com/owner/repo/issues/123">
            </div>
        </div>
        
        <div id="manual-tab" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label for="owner" data-i18n="label.owner">Owner</label>
                    <input type="text" id="owner" name="owner" placeholder="microsoft">
                </div>
                <div class="form-group">
                    <label for="repo" data-i18n="label.repo">Repository</label>
                    <input type="text" id="repo" name="repo" placeholder="vscode">
                </div>
                <div class="form-group">
                    <label for="issue_number" data-i18n="label.issue_number">Issue #</label>
                    <input type="number" id="issue_number" name="issue_number" placeholder="12345">
                </div>
            </div>
        </div>
        
        <button type="submit" id="submitBtn" data-i18n="button.analyse">Analyse Issue</button>
    </form>
    
    <div id="result"></div>
    
    <script src="/static/app.js"></script>
</body>
</html>
